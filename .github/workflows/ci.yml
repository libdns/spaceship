name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LIBDNS_SPACESHIP_RUN_LIVE: '0'
    strategy:
      matrix:
        go-version: ['1.18.x', stable]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting
        run: test -z "$(find . -name '*.go' -type f -not -path './vendor/*' -print0 | xargs -0 gofmt -l)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
